<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetMon - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#141428;border:1px solid #1e1e3a;border-radius:12px;padding:40px;width:340px;max-width:90vw}
.card h1{text-align:center;color:#00d4ff;font-size:22px;margin-bottom:24px}
.card .logo{text-align:center;font-size:36px;margin-bottom:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#667;margin-bottom:6px}
.field input{width:100%;padding:10px 12px;background:#0f0f1a;border:1px solid #1e1e3a;border-radius:6px;color:#eee;font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:#00d4ff}
.btn{width:100%;padding:10px;background:#00d4ff;color:#0f0f1a;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s}
.btn:hover{background:#00b8d4}
.msg{text-align:center;font-size:12px;margin-top:12px;color:#ff6b6b;min-height:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡</div>
  <h1>NetMon Login</h1>
  <form id="f" onsubmit="return doLogin(event)">
    <div class="field"><label>Username</label><input id="u" autocomplete="username" required></div>
    <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign In</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const msg=document.getElementById('msg');
  msg.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
    if(r.ok){window.location.href='/';return}
    const j=await r.json();
    msg.textContent=j.error||'Login failed';
  }catch(err){msg.textContent='Network error'}
}
</script>
</body>
</html>
